[project]
name = "mirror-quant-backend"
version = "1.3.2"
description = "MirrorQuant multi-lead copy-trading & quantitative monitoring engine"
requires-python = ">=3.12"
dependencies = [
    # 上下界与 requirements.txt 同步，不在部署时无界升级。
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "sqlalchemy>=2.0.35,<3",
    "aiosqlite>=0.20.0,<1",
    "greenlet>=3.0.0,<4",
    "httpx[socks]>=0.27.2,<0.29",
    "websockets>=13.1,<16",
    "cryptography>=43.0.1,<47",
    "argon2-cffi>=23.1.0,<26",
    "PyJWT>=2.9.0,<3",
    "python-multipart>=0.0.12,<0.1",
    "segno>=1.6.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<1",
    "respx>=0.21.1,<0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
