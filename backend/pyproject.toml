[project]
name = "mirror-quant-backend"
version = "1.0.0"
description = "MirrorQuant multi-lead copy-trading & quantitative monitoring engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "httpx[socks]>=0.27.2",
    "websockets>=13.1",
    "cryptography>=43.0.1",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
