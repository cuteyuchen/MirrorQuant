services:
  mirrorquant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mirrorquant-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - MQ_DATA_DIR=/app/data
      - MQ_DATABASE_URL=sqlite+aiosqlite:////app/data/mirrorquant.db
    ports:
      - "${MQ_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: mirrorquant-nginx
    restart: unless-stopped
    depends_on:
      mirrorquant:
        condition: service_healthy
    ports:
      - "${MQ_WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
