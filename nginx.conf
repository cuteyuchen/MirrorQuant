# 登录、验证码、初始化与 2FA 共用限速，包含 /mq 前缀。
limit_req_zone $binary_remote_addr zone=mq_auth_limit:10m rate=10r/m;
map $http_upgrade $mq_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    # 安全头在 server 层统一设置，避免 location 的继承覆盖。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Cache-Control "no-store" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/(mq/)?api/auth/ {
        limit_req zone=mq_auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://mirrorquant:8000;
    }

    # 后端 WebSocket 路由没有 /mq 前缀，转发前显式移除。
    location ~ ^/(mq/)?ws/ {
        rewrite ^/mq/(.*)$ /$1 break;
        proxy_pass http://mirrorquant:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mq_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://mirrorquant:8000;
    }
}

